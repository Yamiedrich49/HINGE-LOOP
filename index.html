<!doctype html><html lang="ja"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/><meta name="theme-color" content="#f7f9f7"/><title>HINGE LOOP | Direct Touch</title><style>
:root{color-scheme:light;--ink:#172b35;--muted:#75888f;--line:#dfe7e5;--paper:#f7f9f7;--teal:#08aead;--blue:#608cc7;--gold:#d8a257}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.next{border:none;border-radius:13px;background:#172f3a;color:white;font-size:13px;font-weight:710;padding:13px 17px;white-space:nowrap;box-shadow:0 7px 18px #1c363c22}
.reset{white-space:nowrap;border:1px solid #dce6e4;background:white;border-radius:13px;padding:11px 13px;font-size:13px;font-weight:650;color:#648087}
.badge{display:inline-block;background:#e6f6f2;border-radius:10px;padding:6px 9px;color:#238d87;font-size:11px;font-weight:750}
.win{position:absolute;left:50%;bottom:63px;transform:translate(-50%,8px);min-width:170px;text-align:center;background:#fffefdf2;border:1px solid #d7ede6;border-radius:18px;padding:11px 20px;box-shadow:0 13px 28px #0e57561c;pointer-events:none;opacity:0;transition:opacity .14s,transform .14s;z-index:2}
.win.show{opacity:1;transform:translate(-50%,0)}.win strong{display:block;font-size:17px;letter-spacing:-.04em;color:#148f86}.win span{font-size:11px;color:#73978f}

.sheet{background:white;border-radius:25px;padding:22px;width:min(100%,470px);box-shadow:0 -5px 35px #00282b22}.sheet h2{margin:0 0 6px;font-size:21px;letter-spacing:-.05em}.sheet p{margin:0 0 18px;color:#74898f;font-size:12px}

@media(max-height:650px){.top{padding-top:calc(env(safe-area-inset-top,0px) + 9px)}.top h1{font-size:24px;margin:8px 0 3px}.progress{margin-top:9px}.footer{padding-top:6px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);min-height:82px}.scene-head{top:5px}.scene-head .task{padding:6px 11px}}
.top{padding-top:calc(env(safe-area-inset-top,0px) + 13px)}.top h1{font-size:27px;margin:9px 0 2px}.top .subtitle{font-size:11px}.scene-head .task{font-size:12px}.footer{min-height:78px;padding-top:7px}.help{font-size:12px}.scene{min-height:250px}.kicker .brand{letter-spacing:.14em}
</style></head>
<body><div class="app">
<header class="top"><div class="kicker"><div class="brand"><span class="brandmark">◇</span><span>SPATIAL / STUDIES</span></div><button class="mini" id="stageBtn" aria-label="ステージを選ぶ">LEVEL <span id="levelNow">01</span> / 10 ▾</button></div><h1>HINGE LOOP</h1><p class="subtitle" id="subtitle">指で関節を折り、先端をつなぐ。</p><div class="progress" id="progress"></div></header>
<main class="scene"><div class="scene-head"><div class="task"><span class="dot"></span><span id="task">ゴールをつなごう</span></div></div><canvas id="board" aria-label="3Dパズル操作エリア"></canvas><div class="floating-actions"><button class="icon-btn" id="view" title="視点を変える" aria-label="視点を変える">◈</button><button class="icon-btn" id="sound" title="サウンド" aria-label="音をオンオフ">♫</button></div><div class="win" id="win"><strong>CONNECTED</strong><span>ぴったり、つながった</span></div></main>
<footer class="footer"><div class="footer-row"><div><div class="eyebrow" id="eyebrow">HOW TO PLAY</div><div class="help" id="help">関節をタップして折る</div></div><button class="reset" id="reset">↺ リセット</button><button class="next" id="next" style="display:none">次へ →</button></div></footer>
<div class="modal" id="modal"><div class="sheet"><h2>STAGES</h2><p>試作版なので、好きなステージから検証できます。</p><div class="level-grid" id="levelGrid"></div><button class="sheet-close" id="closeLevels">閉じる</button></div></div>
</div><script>
const GAME='hinge';
const LEVELS=[
 {axes:'z',answer:[1],caption:'ひとつ折るだけ',hint:'● をタップして90°折る',task:'先端を光の輪へ'},
 {axes:'zz',answer:[1,1],caption:'ふたつの関節',hint:'2つの関節を折ってみよう',task:'先端を光の輪へ'},
 {axes:'zzz',answer:[1,1,1],caption:'四角いループ',hint:'折りたたんで輪を閉じよう',task:'先端を光の輪へ'},
 {axes:'zy',answer:[1,3],caption:'上にも曲がる',hint:'青い関節は立体方向へ折れる',task:'先端を光の輪へ'},
 {axes:'zyz',answer:[1,1,1],caption:'立体の折り目',hint:'手前と奥も考えてつなごう',task:'先端を光の輪へ'},
 {axes:'zzy',answer:[1,1,3],direction:true,caption:'向きもぴったり',hint:'先端の向きも小さな線に合わせる',task:'位置と先端の向きをそろえる'},
 {axes:'zyzy',answer:[1,3,1,1],direction:true,caption:'4つの関節',hint:'タップで右回り・横スワイプで逆回り',task:'位置と先端の向きをそろえる'},
 {axes:'zzyz',answer:[1,1,1,3],direction:true,caption:'折りの組み合わせ',hint:'先に根元側を動かしてみよう',task:'位置と先端の向きをそろえる'},
 {axes:'zyzyz',answer:[1,1,1,3,1],direction:true,caption:'空間を巡る',hint:'奥行きも読みながら関節を折る',task:'位置と先端の向きをそろえる'},
 {axes:'zzyzy',answer:[1,3,3,1,3],direction:true,caption:'5つの関節',hint:'折り順を考え、先端を合わせよう',task:'位置と先端の向きをそろえる'}
];

'use strict';
const $=s=>document.querySelector(s);
const canvas=$('#board'),ctx=canvas.getContext('2d',{alpha:true});
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const mod=(x,n)=>(x%n+n)%n;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>1-Math.pow(1-t,3);
const storageKey='spatial_lab_'+GAME+'_v3';
let current=0, angles=[],solved=false, audioOn=true, audioCtx=null, stageStamp=0;
let W=390,H=450,DPR=1, winFlash=0, pointer=null, anim=null, camera=0;
try{const stored=JSON.parse(localStorage.getItem(storageKey)||'{}');current=clamp(stored.level||0,0,9);audioOn=stored.audio!==false}catch(e){}
const put=()=>{try{localStorage.setItem(storageKey,JSON.stringify({level:current,audio:audioOn}))}catch(e){}};
function sound(kind){if(!audioOn)return;try{
 if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume();
 const now=audioCtx.currentTime;
 const ping=(freq,start,duration,vol)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,now+start);g.gain.setValueAtTime(.0001,now+start);g.gain.exponentialRampToValueAtTime(vol,now+start+.008);g.gain.exponentialRampToValueAtTime(.0001,now+start+duration);o.connect(g);g.connect(audioCtx.destination);o.start(now+start);o.stop(now+start+duration+.01)};
 if(kind==='tick'){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(330,now);o.frequency.exponentialRampToValueAtTime(235,now+.055);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.045,now+.004);g.gain.exponentialRampToValueAtTime(.001,now+.065);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.07)}
 if(kind==='win'){ping(523.25,0,.24,.055);ping(783.99,.085,.27,.045);ping(1046.5,.16,.39,.032)}
 if(kind==='soft'){ping(250,0,.06,.02)}
}catch(e){}}
function line(a,b,color,width=2){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineWidth=width;ctx.strokeStyle=color;ctx.lineCap='round';ctx.stroke()}
function disk(p,r,fill,stroke=null,sw=1){ctx.beginPath();ctx.arc(p[0],p[1],r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.stroke()}}
function roundBox(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function arrow(p,theta,size,color){const q=[p[0]+Math.cos(theta)*size,p[1]+Math.sin(theta)*size];line(p,q,color,2);line(q,[q[0]-Math.cos(theta-.65)*size*.34,q[1]-Math.sin(theta-.65)*size*.34],color,2);line(q,[q[0]-Math.cos(theta+.65)*size*.34,q[1]-Math.sin(theta+.65)*size*.34],color,2)}
function onResize(){const rect=canvas.getBoundingClientRect();W=Math.max(200,rect.width);H=Math.max(200,rect.height);DPR=Math.min(window.devicePixelRatio||1,2.5);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR)}
window.addEventListener('resize',onResize);
function refreshHeader(){
 $('#levelNow').textContent=String(current+1).padStart(2,'0');
 $('#subtitle').textContent='棒をつまんで、折り曲げる';
 $('#progress').innerHTML=LEVELS.map((_,i)=>`<i class="${i<current?'done':i===current?'current':''}"></i>`).join('');
 $('#sound').textContent=audioOn?'♫':'♪̸';$('#sound').setAttribute('aria-label',audioOn?'音をオフ':'音をオン');
 $('#win').classList.toggle('show',solved);
 $('#next').style.display=solved?'block':'none';$('#reset').style.display=solved?'none':'block';
 $('#help').textContent=solved?'ぴったり、つながった！':'棒を指でつかんで、先端を輪へ動かそう';
 $('#eyebrow').textContent=solved?'CONNECTED':'DRAG TO BEND';
 $('#task').textContent=current<3?'先端を輪まで運ぼう':'つながる形をつくろう';$('#view').style.display=current>=3?'grid':'none';
}
function loadLevel(index){current=clamp(index,0,LEVELS.length-1);stageStamp++;angles=LEVELS[current].initial?LEVELS[current].initial.slice():LEVELS[current].answer.map(()=>0);anim=null;solved=false;camera=0;winFlash=0;pointer=null;refreshHeader();put();}
function complete(){if(solved)return;solved=true;winFlash=performance.now();sound('win');refreshHeader();try{if(current+1>parseInt(localStorage.getItem(storageKey+'_max')||'0'))localStorage.setItem(storageKey+'_max',current+1);localStorage.setItem(storageKey,JSON.stringify({level:Math.min(current+1,LEVELS.length-1),audio:audioOn}))}catch(e){}}
function step(j,dir=1){if(solved)return;const old=angles.slice();angles[j]=mod(angles[j]+dir,4);anim={i:j,from:old[j],to:old[j]+dir,start:performance.now(),duration:118};sound('tick');if(checkSolved()){const token=stageStamp;setTimeout(()=>{if(token===stageStamp&&checkSolved())complete()},138)}}
$('#sound').onclick=()=>{audioOn=!audioOn;refreshHeader();put();if(audioOn)sound('tick')};
$('#reset').onclick=()=>{loadLevel(current);sound('soft')};
$('#next').onclick=()=>{loadLevel((current+1)%LEVELS.length);sound('tick')};
$('#view').onclick=()=>{camera=mod(camera+1,4);sound('tick')};
$('#stageBtn').onclick=()=>openLevels();
$('#closeLevels').onclick=()=>$('#modal').classList.remove('open');
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};
function openLevels(){const grid=$('#levelGrid');grid.innerHTML='';LEVELS.forEach((l,i)=>{const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0');b.className=i===current?'active':'';b.onclick=()=>{loadLevel(i);$('#modal').classList.remove('open');sound('tick')};grid.appendChild(b)});$('#modal').classList.add('open')}
function beginPointer(e){
 if(e.target!==canvas||solved)return;
 const j=selectPiece(e.offsetX,e.offsetY);if(j<0)return;
 e.preventDefault();try{canvas.setPointerCapture(e.pointerId)}catch(err){}
 const geom=geometry(angles,LEVELS[current].axes);
 pointer={id:e.pointerId,selected:j,startX:e.offsetX,startY:e.offsetY,
  handle:project(geom.points[j+2]),angle:angles[j],old:angles.slice(),moved:false};
 anim=null;
}
function movePointer(e){
 if(!pointer||pointer.id!==e.pointerId)return;e.preventDefault();
 const dx=e.offsetX-pointer.startX,dy=e.offsetY-pointer.startY;
 if(Math.hypot(dx,dy)<5)return;
 pointer.moved=true;const j=pointer.selected,goal=[pointer.handle[0]+dx,pointer.handle[1]+dy];
 let best=Infinity,angle=angles[j];
 const probe=angles.slice();
 for(let i=0;i<128;i++){
   probe[j]=i/32;
   const p=project(geometry(probe,LEVELS[current].axes).points[j+2]);
   let d=(p[0]-goal[0])**2+(p[1]-goal[1])**2;
   d+=Math.min(Math.abs(probe[j]-pointer.angle),4-Math.abs(probe[j]-pointer.angle))*.03;
   if(d<best){best=d;angle=probe[j]}
 }
 angles[j]=angle;
}
function endPointer(e){
 if(!pointer||pointer.id!==e.pointerId)return;e.preventDefault();
 const p=pointer;pointer=null;
 if(!p.moved){angles=p.old;return}
 const j=p.selected,from=angles[j],to=Math.round(from);
 angles[j]=mod(to,4);anim={i:j,from,to,start:performance.now(),duration:90};
 sound('tick');
 if(checkSolved()){const token=stageStamp;setTimeout(()=>{if(token===stageStamp&&checkSolved())complete()},95)}
}
canvas.addEventListener('pointerdown',beginPointer);
canvas.addEventListener('pointermove',movePointer);
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',()=>{if(pointer){angles=pointer.old;pointer=null}});

let lastTime=0;
function frame(now){if(W&&H){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);drawGame(now)}requestAnimationFrame(frame)}
window.addEventListener('DOMContentLoaded',onResize);

function plus(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]]}
function mult(a,v){return a.map(x=>x*v)}
function roundv(a){return a.map(x=>Math.round(x))}
function eq(a,b){return a.every((x,i)=>x===b[i])}
function geometry(states,axes){let px=[0,0,0],rx=[1,0,0],ry=[0,1,0],rz=[0,0,1],p=[px];
 for(let i=0;i<=axes.length;i++){px=plus(px,rx);p.push(px);
  if(i<axes.length){let a=states[i]*Math.PI/2,c=Math.cos(a),s=Math.sin(a);
    if(axes[i]==='z'){let x=plus(mult(rx,c),mult(ry,s));ry=plus(mult(ry,c),mult(rx,-s));rx=x}
    else {let x=plus(mult(rx,c),mult(rz,-s));rz=plus(mult(rx,s),mult(rz,c));rx=x}
  }}
 return {points:p,direction:rx};
}
const solution=()=>geometry(LEVELS[current].answer,LEVELS[current].axes);
function checkSolved(){const p=geometry(angles,LEVELS[current].axes),t=solution();
 const pos=eq(roundv(p.points.at(-1)),roundv(t.points.at(-1)));
 return pos&&(!LEVELS[current].direction||eq(roundv(p.direction),roundv(t.direction)));
}
function project(p){let [x,y,z]=p;for(let i=0;i<camera;i++){let old=x;x=-y;y=old}
 let n=LEVELS[current].axes.length+1;
 const scale=Math.min(92,Math.max(46,(W-45)/(n*.94*1.6))); // all levels fit
 return [W*.44+(x-y)*.83*scale,H*.44+(x+y)*.35*scale-z*.94*scale];
}
function currentGeometry(now){if(anim){let t=clamp((now-anim.start)/anim.duration,0,1),s=angles.map(x=>x);s[anim.i]=lerp(anim.from,anim.to,ease(t));if(t>=1)anim=null;return geometry(s,LEVELS[current].axes)}return geometry(angles,LEVELS[current].axes)}
function drawGrid(){ctx.save();ctx.strokeStyle='#d8e5e1';ctx.lineWidth=.75;ctx.globalAlpha=.33;
 for(let v=-3;v<=4;v++){let p1=project([-3,v,-.85]),p2=project([5,v,-.85]);line(p1,p2,'#d2e0dc',.85);p1=project([v,-3,-.85]);p2=project([v,5,-.85]);line(p1,p2,'#d2e0dc',.85)}ctx.restore()}
function drawRod(a,b,accent=false){let dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);if(len<.5)return;
 ctx.save();ctx.lineCap='round';
 line([a[0]+1,a[1]+5],[b[0]+1,b[1]+5],'#b5c6c537',18);
 line(a,b,accent?'#d4f4eb':'#d9e8e6',19);
 line(a,b,accent?'#35c0b3':'#74afb4',13);
 line([a[0],a[1]-1],[b[0],b[1]-1],accent?'#81e4dc':'#c2e3e0',4);
 ctx.restore()}
function drawHinge(p,index,kind,active){
 ctx.save();disk(p,active?12:10,'#ffffff',active?'#00aa9f':'#b5cbca',active?3:2);
 disk(p,active?5.5:4.2,active?'#11b9af':'#678f91');ctx.restore();
}
function drawTarget(pos,targetDir,now){
 let p=project(pos),r=17+Math.sin(now*.003)*.55;
 ctx.save();ctx.shadowColor='#16b7ad';ctx.shadowBlur=solved?14:5;
 disk(p,r,'#f8fffee8',solved?'#0dbaa8':'#40c8bd',3);
 ctx.shadowBlur=0;disk(p,5.2,'#b4eee5');
 if(LEVELS[current].direction){const a=project(plus(pos,mult(targetDir,-.65)));line(a,p,'#5dbfb4',3);disk(a,3,'#5dbfb4')}
 ctx.restore();
}
function drawGame(now){
 drawGrid();const state=currentGeometry(now),pts=state.points,target=solution(),coords=pts.map(project);
 drawTarget(target.points.at(-1),target.direction,now);
 const segs=[];for(let i=0;i<coords.length-1;i++)segs.push({a:coords[i],b:coords[i+1],depth:pts[i][0]+pts[i][1]+pts[i][2],i});
 segs.sort((a,b)=>a.depth-b.depth);
 segs.forEach(o=>drawRod(o.a,o.b,o.i>0&&pointer?.selected===o.i-1));
 disk(coords[0],11,'#233f47');disk(coords[0],3.5,'#d4efeb');
 for(let j=0;j<LEVELS[current].axes.length;j++)drawHinge(coords[j+1],j,LEVELS[current].axes[j],pointer?.selected===j);
 const tip=coords.at(-1);
 disk(tip,13,'#ffffff','#17afa7',3);disk(tip,6,'#1ab7ae');
 if(!pointer&&current===0&&!solved){
   const hinge=coords[1];ctx.save();ctx.setLineDash([3,5]);ctx.beginPath();ctx.arc(hinge[0],hinge[1],Math.hypot(tip[0]-hinge[0],tip[1]-hinge[1]),-.6,1.3);ctx.strokeStyle='#50c3bb88';ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);ctx.restore();
 }
 if(solved){let delta=now-winFlash;ctx.save();ctx.globalAlpha=Math.max(0,1-delta/620);disk(tip,18+delta*.07,'#ffffff00','#22baaf',2);ctx.restore()}
 ctx.fillStyle='#91aaa9';ctx.textAlign='center';ctx.font='600 11px system-ui';ctx.fillText('棒をドラッグ',W*.5,H-20);
}
function pointSegmentDistance(x,y,a,b){
 const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;
 const t=l>0?clamp(((x-a[0])*dx+(y-a[1])*dy)/l,0,1):0;
 return Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy);
}
function selectPiece(x,y){
 if(solved)return-1;
 const pts=geometry(angles,LEVELS[current].axes).points.map(project);
 let best=-1,dist=36;
 for(let j=0;j<angles.length;j++){
  const d=pointSegmentDistance(x,y,pts[j+1],pts[j+2]);
  if(d<dist){dist=d;best=j}
 }
 return best;
}
